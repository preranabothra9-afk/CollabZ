<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 40" fill="none">
  <defs>
    <linearGradient id="ms-grad" x1="0" y1="0" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="ms-glow" x1="0" y1="0" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#4338ca" stop-opacity="0.07"/>
    </linearGradient>
  </defs>
  <!-- MindSync "M" icon mark -->
  <g transform="translate(2, 2)">
    <!-- Outer glow ring -->
    <circle cx="18" cy="18" r="17" fill="url(#ms-glow)" stroke="url(#ms-grad)" stroke-width="0.5" opacity="0.4"/>
    <!-- The "M" — two uprights joined by a central notch -->
    <path d="M10 25 L10 9 L18 19 L26 9 L26 25" stroke="url(#ms-grad)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Baseline -->
    <path d="M10 25 L26 25" stroke="url(#ms-grad)" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
    <!-- Sync oscillation ripple -->
    <path d="M12.5 30 Q15.5 27.5 18 30 Q20.5 32.5 23.5 30" stroke="#6366f1" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.7"/>
    <!-- Node highlights at the three peaks -->
    <circle cx="18" cy="19" r="2.5" fill="url(#ms-grad)"/>
    <circle cx="10" cy="9" r="2.2" fill="#4f46e5"/>
    <circle cx="26" cy="9" r="2.2" fill="#4338ca"/>
    <!-- Inner pulse dots -->
    <circle cx="18" cy="19" r="1" fill="white" opacity="0.9"/>
    <circle cx="10" cy="9" r="0.8" fill="white" opacity="0.7"/>
    <circle cx="26" cy="9" r="0.8" fill="white" opacity="0.7"/>
  </g>
  <!-- Wordmark -->
  <text x="46" y="26" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="700" font-size="18" fill="#33322c" letter-spacing="-0.5">Mind</text>
  <text x="90" y="26" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="700" font-size="18" fill="#4f46e5" letter-spacing="-0.5">Sync</text>
</svg>
